name: Feature Request
description: Propose a new capability, citation format, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What research or citation problem does this solve?
      description: Describe the workflow gap and why existing tools fall short.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design & invariants
      description: Note any privacy, read-only library, or fail-closed page-number requirements.
    validations:
      required: false
