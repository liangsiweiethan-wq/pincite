name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # GitHub runners are slower than a local Mac; widen timing gates.
      LIT_PERF_RELAXED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Privacy gate & self-test
        run: |
          python3 -I Scripts/privacy-gate.py
          python3 -I Scripts/privacy-gate.py --self-test

      - name: Generated Xcode project is clean
        run: |
          swift Scripts/generate-project.swift
          git diff --exit-code -- app/
          test -z "$(git ls-files --others --exclude-standard -- app/)"

      - name: L10n drift check
        run: Scripts/l10n-drift-check.sh

      - name: Build all targets (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run synthetic test suite
        run: swift test

      - name: Offline CLI end-to-end smoke
        run: |
          TMP_SMOKE=$(mktemp -d)
          trap 'rm -rf "$TMP_SMOKE"' EXIT
          mkdir -p "$TMP_SMOKE/lib"
          swift run literaturesearch-cli genpdf --out "$TMP_SMOKE/lib/smoke.pdf" \
            --page "Page one introductory text" \
            --page "Page two pinpoint citation anchor" \
            --page "Page three closing summary"
          swift run literaturesearch-cli index "$TMP_SMOKE/lib" --db "$TMP_SMOKE/index.db"
          OUT=$(swift run literaturesearch-cli search "pinpoint" --db "$TMP_SMOKE/index.db")
          echo "$OUT"
          echo "$OUT" | grep -q "total matching pages: 1"

      - name: Build macOS app (Release, unsigned)
        run: >
          xcodebuild -project app/LiteratureSearch.xcodeproj -scheme LiteratureSearch
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/pincite-macos"
          CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS companion (Simulator, unsigned)
        run: >
          xcodebuild -project app/LiteratureSearch.xcodeproj -scheme LiteratureSearchiOS
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/pincite-ios"
          CODE_SIGNING_ALLOWED=NO build

      - name: Build watchOS companion (Simulator, unsigned)
        run: >
          xcodebuild -project app/LiteratureSearch.xcodeproj -scheme LiteratureSearchWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/pincite-watch"
          CODE_SIGNING_ALLOWED=NO build
