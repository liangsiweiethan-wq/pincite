name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.3.0)'
        required: true
        default: '0.3.0'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LIT_PERF_RELAXED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Run full preflight gate
        run: Scripts/preflight.sh

      - name: Package ad-hoc macOS DMG
        run: Scripts/package-release.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          DMG=".build/release-dist/PinCite-$V-macOS-adhoc.dmg"
          SUMS=".build/release-dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$SUMS" --clobber
          else
            gh release create "$TAG" "$DMG" "$SUMS" \
              --title "PinCite $TAG" \
              --generate-notes
          fi
