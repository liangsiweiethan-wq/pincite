<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="PinCite — Pinpoint every quote to its exact PDF page">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F2ECE0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCFBF7"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#221E18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#paperBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="20" fill="none" stroke="#E2DACB"/>

  <!-- Subtle margin rule -->
  <line x1="68" y1="36" x2="68" y2="384" stroke="#E5DEC9" stroke-width="1"/>

  <!-- Seal / Pin mark -->
  <rect x="92" y="54" width="44" height="44" rx="8" fill="#A15C1F"/>
  <path d="M107 66h14v22l-7-5-7 5V66z" fill="#FAF7F0"/>

  <text x="150" y="75" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#A15C1F">LOCAL-FIRST · MACOS &amp; SWIFT</text>
  <text x="150" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6F675A">ZERO CLOUD · ZERO DEPENDENCIES · VERIFIABLE CITATIONS</text>

  <!-- Title & Tagline -->
  <text x="92" y="168" font-family="Georgia, 'Songti SC', serif" font-size="56" font-weight="700" fill="#1E1B16">PinCite</text>
  <text x="296" y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="500" fill="#7D7466">页锚</text>

  <text x="92" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="500" fill="#322C24">Pinpoint every quote to its exact PDF page —</text>
  <text x="92" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="#5A5247">locally, verifiably, with fingerprint-checked jump-back.</text>

  <!-- Metric pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">
    <rect x="92" y="282" width="126" height="32" rx="8" fill="#EBE3D3"/>
    <text x="155" y="302" text-anchor="middle" fill="#322C24">SQLite FTS5</text>

    <rect x="228" y="282" width="144" height="32" rx="8" fill="#EBE3D3"/>
    <text x="300" y="302" text-anchor="middle" fill="#322C24">21 Cite Styles</text>

    <rect x="382" y="282" width="136" height="32" rx="8" fill="#EBE3D3"/>
    <text x="450" y="302" text-anchor="middle" fill="#322C24">1,124+ Tests</text>
  </g>

  <text x="92" y="360" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" fill="#6F675A">CJK Substring · Latin Word · Pinyin Title · 3-Track Page Truth · stdio MCP</text>

  <!-- Right preview card: Verification Flow -->
  <g filter="url(#cardShadow)">
    <rect x="646" y="48" width="474" height="324" rx="14" fill="url(#cardBg)" stroke="#DFD6C5"/>
  </g>

  <!-- Search bar mock -->
  <rect x="670" y="72" width="426" height="40" rx="9" fill="#F5F1E8" stroke="#DDD4C3"/>
  <circle cx="692" cy="92" r="6" fill="none" stroke="#8C8273" stroke-width="1.8"/>
  <line x1="696.5" y1="96.5" x2="701" y2="101" stroke="#8C8273" stroke-width="1.8" stroke-linecap="round"/>
  <text x="714" y="97" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#2A251E">rule of recognition · physical page anchor</text>

  <!-- Hit snippet card -->
  <rect x="670" y="128" width="426" height="126" rx="10" fill="#FAF7F1" stroke="#E5DDD0"/>
  <rect x="670" y="128" width="5" height="126" rx="2.5" fill="#A15C1F"/>
  <text x="690" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A15C1F">SHA-256 VERIFIED · PHYSICAL p.14 · PRINTED p.142</text>
  <text x="690" y="182" font-family="Georgia, serif" font-size="14.5" fill="#2D2820">"...the ultimate criterion of validity resides in</text>
  <rect x="690" y="191" width="144" height="22" rx="4" fill="#F6DFC3"/>
  <text x="694" y="207" font-family="Georgia, serif" font-size="14.5" font-weight="600" fill="#5E310B">a rule of recognition</text>
  <text x="840" y="207" font-family="Georgia, serif" font-size="14.5" fill="#2D2820">accepted in official practice..."</text>
  <text x="690" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#776E60">UTF-16 [418..437) · OCR: none (native text layer)</text>

  <!-- Action footer -->
  <rect x="670" y="270" width="206" height="44" rx="8" fill="#1E1B16"/>
  <text x="773" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" font-weight="600" fill="#FAF7F0">Jump to Exact PDF Bounds</text>

  <rect x="888" y="270" width="208" height="44" rx="8" fill="#EFE9DC" stroke="#D8CEBC"/>
  <text x="992" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" font-weight="600" fill="#2A251E">Copy Bluebook / GB/T 7714</text>

  <text x="672" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7D7466">Read-only library · 127.0.0.1 HTTP API · stdio MCP bridge</text>
</svg>
